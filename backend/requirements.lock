# Fully-resolved dependency lock — generated, do not hand-edit.
#
# requirements.txt states intent (deliberate ranges — see the comment at its
# top on why majors are gated but minors/patches float between test runs).
# This file pins every one of those ranges to the exact version, PLUS every
# transitive dependency, that Docker and CI actually install — so the same
# commit installs the same bytes regardless of which day it's built.
#
# Resolved inside python:3.12-slim (the real production base image — see
# backend/Dockerfile), not on a developer's host OS, since pure-version
# resolution can differ by platform even for identical constraints. Verified
# concretely while generating this file: reportlab>=4.0.0,<6.0.0 resolved to
# 5.0.1 here and had resolved to 5.0.0 on Windows earlier the same week — the
# exact class of drift this file exists to eliminate.
#
# Regenerate after any requirements.txt change:
#   docker build -f Dockerfile -t mfs-lock-tmp --target lock-export . \
#     && docker run --rm mfs-lock-tmp > requirements.lock
# (or see the one-off build used to generate this file in the PR/commit that
# added it, if the Dockerfile has no such stage — a plain
#   docker run --rm -w /app -v "$(pwd)":/app python:3.12-slim \
#     sh -c "pip install -q -r requirements.txt && pip freeze"
# works too.)
#
# uvloop is Linux/Unix-only (uvicorn[standard] pulls it conditionally) and
# will not appear if this is ever regenerated on Windows or macOS without a
# container — that would be a real regression, not noise, since production
# is always Linux.

