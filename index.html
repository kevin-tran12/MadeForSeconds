<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="etwV8yvD2X8KLRJi667h6BWyxGsEUTT2NrV-I6dsFJc" />
    <title>MadeForSeconds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Applies the stored theme before first paint to avoid a light-mode flash.
         CSP-sensitive: public/_headers whitelists this script by sha256 hash.
         If you edit it, recompute the hash or it will be blocked silently. -->
    <script>
      (function () {
        var t = localStorage.getItem('theme')
        var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
