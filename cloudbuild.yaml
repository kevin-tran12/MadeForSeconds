steps:
  # Build the backend Docker image targeting linux/amd64 for Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --platform
      - linux/amd64
      - -t
      - '$_IMAGE:$SHORT_SHA'
      - -t
      - '$_IMAGE:latest'
      - ./backend

  # Push both tags
  - name: 'gcr.io/cloud-builders/docker'
    args: [push, '$_IMAGE:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: [push, '$_IMAGE:latest']

  # Deploy the new revision without moving traffic to it yet. Cloud Run's
  # startup probe (cloud_run.tf) only proves the container came up — it says
  # nothing about whether the app actually works, so a revision that passes
  # the probe but is otherwise broken used to get 100% traffic instantly.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - mfs-backend
      - --image=$_IMAGE:$SHORT_SHA
      - --region=$LOCATION
      - --no-traffic
      - --tag=candidate-$SHORT_SHA
      - --quiet

  # Smoke test the candidate revision on its own tagged URL, before it ever
  # sees real traffic. If this step fails, the build fails here and the
  # previous revision keeps serving 100% — no separate rollback needed
  # because traffic was never moved.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        CANDIDATE_URL=$(gcloud run services describe mfs-backend \
          --region=$LOCATION \
          --format=json \
          | python3 -c "import json,sys; svc=json.load(sys.stdin); print(next(t['url'] for t in svc['status']['traffic'] if t.get('tag') == 'candidate-$SHORT_SHA'))")
        echo "Candidate revision URL: $$CANDIDATE_URL"
        python3 backend/scripts/smoke_test_deploy.py --url "$$CANDIDATE_URL"

  # Smoke test passed — promote the candidate revision to serve 100% of
  # traffic.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - mfs-backend
      - --region=$LOCATION
      - --to-latest
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY
