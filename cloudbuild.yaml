steps:
  # Build the backend Docker image targeting linux/amd64 for Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --platform
      - linux/amd64
      - -t
      - '$_IMAGE:$SHORT_SHA'
      - -t
      - '$_IMAGE:latest'
      - ./backend

  # Push both tags
  - name: 'gcr.io/cloud-builders/docker'
    args: [push, '$_IMAGE:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: [push, '$_IMAGE:latest']

  # Deploy the new image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - mfs-backend
      - --image=$_IMAGE:$SHORT_SHA
      - --region=$LOCATION
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY
