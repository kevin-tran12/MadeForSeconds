name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only reads repository contents. Keep the default token read-only so
# a compromised build step cannot modify the repository or its pull requests.
permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # gitleaks needs the full history to scan every commit, not just the tip.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # Published in gitleaks_${VERSION}_checksums.txt on the release itself
          # (github.com/gitleaks/gitleaks/releases/tag/v8.30.1) — pinned here so
          # a compromised release asset (swapped after the fact, or a
          # MITM'd download) fails closed instead of installing silently.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: gitleaks — secret scan across full git history
        # Live Stripe, Instagram, and Redis credentials live in gitignored files
        # (.env.local, terraform/terraform.tfvars) right beside tracked ones.
        # This is the backstop for the day someone runs `git add -f`.
        run: gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit — Python SAST (medium+ severity)
        # Also covers the two Cloud Functions (terraform/modules/*/*_function/)
        # — billing_function holds run.admin on the backend service and
        # secret_pruner_function holds secretmanager.versions.destroy, so a
        # vulnerability there is at least as consequential as one in the
        # backend app — and backend/scripts, the operator-run smoke tests
        # that impersonate real production service accounts (previously
        # unscanned entirely; closing this surfaced a real B602 shell=True
        # finding in smoke_test_secret_pruner.py, since fixed).
        run: |
          bandit -r backend/app -ll
          bandit -r backend/scripts -ll
          bandit -r terraform/modules/cost-controls/billing_function -ll
          bandit -r terraform/modules/secret-maintenance/secret_pruner_function -ll

      - name: pip-audit — Python dependency CVEs
        # requirements.lock, not requirements.txt: audit what actually ships,
        # not whatever a range happens to resolve to on a given day. The two
        # Cloud Functions have no separate lock step (see their
        # requirements.txt headers — the whole file is already fully pinned,
        # direct and transitive alike, so it doubles as its own lock file).
        # CVE-2026-4539: pygments (via rich) — no fix released yet, ignore until patch ships
        run: |
          pip-audit -r backend/requirements.lock --ignore-vuln CVE-2026-4539
          pip-audit -r terraform/modules/cost-controls/billing_function/requirements.txt
          pip-audit -r terraform/modules/secret-maintenance/secret_pruner_function/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: npm audit — Node production dependency CVEs (high+)
        run: npm audit --audit-level=high --omit=dev

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        # requirements.lock, not requirements.txt — CI and the production
        # Docker image must resolve identically. See requirements.lock's
        # header for what generates it and why.
        run: pip install -r backend/requirements.lock

      - name: Install functions-framework for the secret-pruner smoke test's unit tests
        # test_smoke_test_secret_pruner.py imports secret_pruner_function/main.py
        # directly (deliberately — see the smoke test script's own docstring on
        # why it doesn't reimplement that algorithm), which needs
        # functions_framework at import time. Deliberately not added to
        # requirements.lock: that file is "what actually ships in the backend
        # Docker image," and functions_framework never does.
        run: pip install functions-framework==3.10.2

      - name: Run pytest
        working-directory: backend
        # tee: keep the human-readable log AND capture it for the inventory
        # check below, without running pytest a second time just to count.
        # pipefail: a bare `cmd | tee file` step exits 0 regardless of cmd's
        # own exit code (the default GitHub Actions shell doesn't set this),
        # which would silently turn a real test failure green here.
        run: set -o pipefail && pytest --cov=app --cov-report=term-missing | tee /tmp/pytest-output.txt
        env:
          PYTHONPATH: .
          ENVIRONMENT: development
          SUBSCRIBER_JWT_SECRET: ci-test-secret-placeholder-value-32ch

      - name: Verify backend test-count inventory
        run: python3 scripts/check_inventory.py backend-count --output /tmp/pytest-output.txt

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        # tee: keep the human-readable log AND capture it for the inventory
        # check below, without running vitest a second time just to count.
        # pipefail: see the same note on the backend job's pytest step.
        run: set -o pipefail && npm run test:unit | tee /tmp/vitest-output.txt

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Verify frontend test-count inventory
        run: python3 scripts/check_inventory.py frontend-count --output /tmp/vitest-output.txt

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only chromium in CI — firefox/webkit still run locally via the full
      # project matrix in playwright.config.ts. Keeps the CI job's runtime down.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # docker-compose.yml's "app" service declares env_file: .env.local, and
      # Compose resolves every service's env_file up front regardless of which
      # services a given command targets — so `up`/`exec`/`down` all fail on a
      # fresh checkout without this file, even though "app" is never started
      # here. Frontend is deliberately not started via compose at all —
      # Playwright's own webServer (playwright.config.ts) launches `npm run
      # dev` against VITE_API_URL below. redis comes up automatically as
      # backend's dependency.
      - name: Create .env.local placeholder for docker compose
        run: cp .env.local.example .env.local

      - name: Start Firestore emulator + backend
        run: docker compose up -d --build firestore-emulator backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health >/dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time" >&2
          docker compose logs backend
          exit 1

      - name: Seed sample data
        run: docker compose exec -T backend python seed.py

      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium
        env:
          VITE_API_URL: http://localhost:8000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Tear down docker compose
        if: always()
        run: docker compose down -v

  terraform-check:
    name: Terraform Validate
    runs-on: ubuntu-latest
    # id-token: write is needed only for the WIF auth step below (Workload
    # Identity Federation exchanges this token for a short-lived GCP
    # credential — google-github-actions/auth requires it). contents stays
    # read-only, same as every other job — this workflow deliberately never
    # requests pull-requests: write, so plan output goes to this job's own
    # log + an uploaded artifact, not an auto-posted PR comment; granting
    # write access to PRs is exactly the risk this hardening pass spends
    # several other PRs trying to reduce, not something to reopen here for
    # convenience.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          # Must match terraform/.terraform-version and required_version in
          # main.tf. Unpinned, this installs whatever is newest that day, and
          # fmt rules drift between releases — CI then fails on formatting a
          # developer's pinned CLI just produced.
          terraform_version: 1.15.9

      - name: terraform fmt
        working-directory: terraform
        # -recursive: fmt only walks the given directory otherwise, so module
        # subdirectories would go unchecked.
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        working-directory: terraform
        # -backend=false: validation needs no state or GCP credentials
        run: terraform init -backend=false -input=false && terraform validate -no-color

      # terraform/tests/*.tftest.hcl. mock_provider stands in for the google
      # providers, so these plan without credentials and without touching the
      # project — the init above is all the setup they need.
      - name: terraform test
        working-directory: terraform
        run: terraform test -no-color

      # The budget circuit breaker lives in terraform/, so the backend pytest
      # job (which runs `pytest --cov=app` from backend/) never collects it.
      # Path follows billing_function/ into modules/cost-controls/ — the module
      # refactor moves it because billing.tf resolves it via ${path.module}.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Test budget circuit breaker
        working-directory: terraform/modules/cost-controls/billing_function
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q

      - name: Test secret version pruner
        working-directory: terraform/modules/secret-maintenance/secret_pruner_function
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q

      # Everything below needs real GCP credentials, which a forked PR never
      # gets (GitHub withholds secrets/vars and, with it, any meaningful WIF
      # trust from fork-triggered pull_request runs) — this condition is the
      # explicit, visible equivalent of that for same-repo branches, PRs and
      # pushes to main both proceed; only forked PRs skip, with a clear
      # notice rather than a silent gap or a red X.
      - name: Note that GCP-authenticated plan steps are skipped for forked PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::Forked PR — skipping the production/staging terraform plan steps below (no GCP credentials for forks). fmt/validate/test above already ran and are unaffected."

      - name: Authenticate to GCP via Workload Identity Federation
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # Plan visibility only — this job never applies. Sensitive-backed
      # variables (stripe_secret_key, stripe_webhook_secret,
      # subscriber_jwt_secret, redis_url, resend_api_key) get short,
      # deliberately-fake placeholder strings, never real values: every one
      # of the resources they gate uses `lifecycle { ignore_changes =
      # [secret_data] }` (terraform/modules/security/secrets.tf), so
      # Terraform never diffs the actual secret content against what a
      # placeholder says — the placeholder's only job is satisfying each
      # resource's `count = var.x != "" ? 1 : 0` gate so the plan doesn't
      # propose destroying a real secret just because CI doesn't have its
      # value. stripe_secret_key/stripe_webhook_secret/subscriber_jwt_secret
      # are always non-blank here because the app itself requires them in
      # production (backend/app/config.py's validate_production_settings) —
      # not a guess about this deployment specifically. redis_url and
      # resend_api_key are genuinely optional, so their shape (configured or
      # not) comes from two plain, non-secret repo variables the operator
      # set by checking `gcloud secrets list` once, not from assuming either
      # way.
      - name: Plan — production
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: terraform
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID_PROD }}
          TF_VAR_admin_emails: ${{ vars.ADMIN_EMAILS }}
          TF_VAR_allowed_origins: ${{ vars.PROD_ALLOWED_ORIGINS }}
          TF_VAR_backend_image: ${{ vars.PROD_BACKEND_IMAGE }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
          TF_VAR_state_admin_email: ${{ vars.STATE_ADMIN_EMAIL }}
          TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          TF_VAR_deployment_target: production
          TF_VAR_staging_gcp_project_id: ${{ vars.GCP_PROJECT_ID_STAGING }}
          TF_VAR_stripe_secret_key: ci-plan-placeholder-not-real
          TF_VAR_stripe_webhook_secret: ci-plan-placeholder-not-real
          TF_VAR_subscriber_jwt_secret: ci-plan-placeholder-not-real
        run: |
          set -euo pipefail
          if [ "${{ vars.PROD_REDIS_CONFIGURED }}" = "true" ]; then
            export TF_VAR_redis_url="rediss://ci-plan-placeholder-not-real"
          fi
          if [ "${{ vars.PROD_RESEND_CONFIGURED }}" = "true" ]; then
            export TF_VAR_resend_api_key="ci-plan-placeholder-not-real"
          fi
          terraform init -input=false
          terraform plan -lock-timeout=5m -input=false -no-color -out=/tmp/tfplan-production
          terraform show -no-color /tmp/tfplan-production

      - name: Upload production plan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: terraform-plan-production
          path: /tmp/tfplan-production
          retention-days: 7

      - name: Plan — staging
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: terraform/environments/staging
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID_STAGING }}
          TF_VAR_admin_emails: ${{ vars.ADMIN_EMAILS }}
          TF_VAR_allowed_origins: ${{ vars.STAGING_ALLOWED_ORIGINS }}
          TF_VAR_backend_image: ${{ vars.STAGING_BACKEND_IMAGE }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
          TF_VAR_state_admin_email: ${{ vars.STATE_ADMIN_EMAIL }}
          TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
        run: |
          terraform init -input=false
          terraform plan -lock-timeout=5m -input=false -no-color -out=/tmp/tfplan-staging
          terraform show -no-color /tmp/tfplan-staging

      - name: Upload staging plan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: terraform-plan-staging
          path: /tmp/tfplan-staging
          retention-days: 7

  inventory-check:
    name: Inventory Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      # No test execution here — file counts (ls-based) and toolchain
      # versions (regex over manifests) only. The live test-COUNT checks run
      # as steps inside test-backend/test-frontend instead, right after
      # those jobs' own test runs, so nothing here duplicates a test suite
      # just to count it. See scripts/check_inventory.py's own docstring.
      - name: Verify README.md against manifests
        run: python3 scripts/check_inventory.py static

  build:
    name: Build Check
    needs:
      [
        security-scan,
        test-backend,
        test-frontend,
        test-e2e,
        terraform-check,
        inventory-check,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript + Vite build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
