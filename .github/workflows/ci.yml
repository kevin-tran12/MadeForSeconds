name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit — Python SAST (medium+ severity)
        run: bandit -r backend/app -ll

      - name: pip-audit — Python dependency CVEs
        # CVE-2026-4539: pygments (via rich) — no fix released yet, ignore until patch ships
        run: pip-audit -r backend/requirements.txt --ignore-vuln CVE-2026-4539

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: npm audit — Node production dependency CVEs (high+)
        run: npm audit --audit-level=high --omit=dev

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing
        env:
          PYTHONPATH: .
          ENVIRONMENT: development
          SUBSCRIBER_JWT_SECRET: ci-test-secret-placeholder-value-32ch

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  terraform-check:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        working-directory: terraform
        run: terraform fmt -check -diff

      - name: terraform validate
        working-directory: terraform
        # -backend=false: validation needs no state or GCP credentials
        run: terraform init -backend=false -input=false && terraform validate -no-color

  build:
    name: Build Check
    needs: [security-scan, test-backend, test-frontend, terraform-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript + Vite build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
