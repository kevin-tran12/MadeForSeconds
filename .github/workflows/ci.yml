name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs the full history to scan every commit, not just the tip.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: gitleaks — secret scan across full git history
        # Live Stripe, Instagram, and Redis credentials live in gitignored files
        # (.env.local, terraform/terraform.tfvars) right beside tracked ones.
        # This is the backstop for the day someone runs `git add -f`.
        run: gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit — Python SAST (medium+ severity)
        run: bandit -r backend/app -ll

      - name: pip-audit — Python dependency CVEs
        # CVE-2026-4539: pygments (via rich) — no fix released yet, ignore until patch ships
        run: pip-audit -r backend/requirements.txt --ignore-vuln CVE-2026-4539

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: npm audit — Node production dependency CVEs (high+)
        run: npm audit --audit-level=high --omit=dev

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing
        env:
          PYTHONPATH: .
          ENVIRONMENT: development
          SUBSCRIBER_JWT_SECRET: ci-test-secret-placeholder-value-32ch

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  terraform-check:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Must match terraform/.terraform-version and required_version in
          # main.tf. Unpinned, this installs whatever is newest that day, and
          # fmt rules drift between releases — CI then fails on formatting a
          # developer's pinned CLI just produced.
          terraform_version: 1.15.8

      - name: terraform fmt
        working-directory: terraform
        # -recursive: fmt only walks the given directory otherwise, so module
        # subdirectories would go unchecked.
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        working-directory: terraform
        # -backend=false: validation needs no state or GCP credentials
        run: terraform init -backend=false -input=false && terraform validate -no-color

      # The budget circuit breaker lives in terraform/, so the backend pytest
      # job (which runs `pytest --cov=app` from backend/) never collects it.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test budget circuit breaker
        working-directory: terraform/billing_function
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q

  build:
    name: Build Check
    needs: [security-scan, test-backend, test-frontend, terraform-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript + Vite build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
