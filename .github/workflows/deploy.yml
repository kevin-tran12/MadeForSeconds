name: Deploy

# Merge-to-main promotion pipeline (hardening plan PR 10). Builds the backend
# image once, proves it against staging with a real apply + deploy + seed +
# full E2E run, and only then repeats apply + deploy against production with
# the exact same image. Any failure stops before production is touched.
#
# PR-time validation (fmt/validate/test/plan) stays in ci.yml — this workflow
# is the merge-time half of terraform/README.md's "Terraform lifecycle
# coverage" table, and only runs for real pushes to main, never for PRs
# (forks included — a forked PR can't reach this file at all, since it only
# triggers on push).
on:
  push:
    branches: [main]

permissions:
  contents: read

# Two merges in flight queue rather than race — the GCS state backend locks
# regardless, but a queued run beats a failed one colliding mid-apply.
concurrency:
  group: promotion-pipeline
  cancel-in-progress: false

env:
  REGION: us-central1

jobs:
  build:
    name: Build & push backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push-staging.outputs.digest }}
      short_sha: ${{ steps.short-sha.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Cloud Run's own limit: a --tag value plus the service name
      # ("mfs-backend", 11 chars) together can't exceed 46 characters.
      # candidate- (10) + the full 40-char github.sha blows well past that
      # — found by a real deploy failing with exactly that error on this
      # pipeline's first live run. 7 hex chars is the same convention
      # `git rev-parse --short` and cloudbuild.yaml's old $SHORT_SHA used.
      - name: Compute short SHA for Cloud Run tags
        id: short-sha
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # mfs-deploy, not mfs-terraform — this identity only ever pushes an
      # image and deploys it (modules/backend-service/deploy_iam.tf), the
      # narrowest grant for what this job and the two deploy jobs below do.
      # Authenticated per-project below since mfs-deploy is a separate
      # identity in each project, not the one shared mfs-terraform is.
      - name: Authenticate as mfs-deploy (staging)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: mfs-deploy@${{ vars.GCP_PROJECT_ID_STAGING }}.iam.gserviceaccount.com

      - name: Configure Docker for staging Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Built once. Pushed to both projects' own `mfs` repos below rather
      # than one shared repo with a cross-project pull grant — see
      # docs/DEPLOYMENT.md's "Build once, promote by digest without a
      # cross-project registry pull" for why. Same local image both times,
      # so the digest each push reports must match — verified explicitly
      # below rather than assumed.
      - name: Build image
        run: docker build --platform linux/amd64 -t backend:${{ github.sha }} ./backend

      - name: Install trivy
        env:
          TRIVY_VERSION: 0.74.0
          # Published in trivy_${VERSION}_checksums.txt on the release itself
          # (github.com/aquasecurity/trivy/releases/tag/v0.74.0) — verified
          # before install, same convention as ci.yml's gitleaks download.
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          curl -sSfL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

      # CycloneDX SBOM of the exact bytes about to be deployed — generated
      # before any push, from the local image, so it describes what was
      # actually built rather than being re-derived from source later.
      - name: Generate CycloneDX SBOM
        run: trivy image --format cyclonedx --output /tmp/sbom.cdx.json backend:${{ github.sha }}

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-backend-${{ github.sha }}
          path: /tmp/sbom.cdx.json

      # Gates before either registry push — a vulnerable image never leaves
      # this job. .trivyignore (repo root) is the documented, expiring
      # allowlist for any HIGH/CRITICAL finding with no available fix.
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore backend:${{ github.sha }}

      - name: Tag for staging registry
        run: docker tag backend:${{ github.sha }} ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_STAGING }}/mfs/backend:${{ github.sha }}

      - name: Push to staging registry
        id: push-staging
        run: |
          set -euo pipefail
          ref="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_STAGING }}/mfs/backend:${{ github.sha }}"
          digest=$(docker push "$ref" | grep -oP 'digest: \Ksha256:[a-f0-9]+')
          echo "Staging digest: $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Authenticate as mfs-deploy (production)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: mfs-deploy@${{ vars.GCP_PROJECT_ID_PROD }}.iam.gserviceaccount.com

      - name: Configure Docker for production Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Tag for production registry
        run: docker tag backend:${{ github.sha }} ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_PROD }}/mfs/backend:${{ github.sha }}

      - name: Push to production registry and verify the digest matches staging's
        run: |
          set -euo pipefail
          ref="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_PROD }}/mfs/backend:${{ github.sha }}"
          digest=$(docker push "$ref" | grep -oP 'digest: \Ksha256:[a-f0-9]+')
          echo "Production digest: $digest"
          if [ "$digest" != "${{ steps.push-staging.outputs.digest }}" ]; then
            echo "::error::Production push digest ($digest) does not match staging's (${{ steps.push-staging.outputs.digest }}) — refusing to deploy an unverified image."
            exit 1
          fi

      # Recorded once against the content-addressed digest (identical in
      # both registries, verified above), not per-registry — the digest is
      # what makes this attestation meaningful regardless of which
      # registry reference it's later pulled through. Verifiable via
      # `gh attestation verify` against this repo.
      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3
        with:
          subject-name: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_STAGING }}/mfs/backend
          subject-digest: ${{ steps.push-staging.outputs.digest }}

  staging-apply:
    name: Apply Terraform (staging)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: 1.15.9

      - name: Authenticate as mfs-terraform
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # stripe_secret_key / stripe_webhook_secret / subscriber_jwt_secret
      # default to "" in terraform/variables.tf, and each secret's
      # google_secret_manager_secret is gated `count = var.x != "" ? 1 : 0`.
      # ci.yml's plan-only job can get away with fake placeholders for these
      # (a plan is read-only, so a wrong plan is just misleading output) —
      # this job actually applies, so a blank value here would DESTROY the
      # real staging secret on a real apply, not just show a wrong diff.
      # Fail loudly before terraform ever runs rather than let that happen.
      - name: Verify required secrets are present before applying
        run: |
          missing=""
          [ -z "${{ secrets.STRIPE_TEST_SECRET_KEY }}" ] && missing="$missing STRIPE_TEST_SECRET_KEY"
          [ -z "${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}" ] && missing="$missing STRIPE_TEST_WEBHOOK_SECRET"
          [ -z "${{ secrets.STAGING_SUBSCRIBER_JWT_SECRET }}" ] && missing="$missing STAGING_SUBSCRIBER_JWT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing — refusing to apply, this would destroy the real staging Secret Manager resource(s) rather than just fail to update them."
            exit 1
          fi

      - name: Terraform init/plan/apply — staging
        working-directory: terraform/environments/staging
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID_STAGING }}
          TF_VAR_admin_emails: ${{ vars.ADMIN_EMAILS }}
          TF_VAR_allowed_origins: ${{ vars.STAGING_ALLOWED_ORIGINS }}
          TF_VAR_backend_image: ${{ vars.STAGING_BACKEND_IMAGE }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
          TF_VAR_state_admin_email: ${{ vars.STATE_ADMIN_EMAIL }}
          TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          TF_VAR_subscriber_jwt_secret: ${{ secrets.STAGING_SUBSCRIBER_JWT_SECRET }}
          # Both required by validate_production_settings() (backend/app/config.py)
          # — a blank value here doesn't fail the apply, it fails the NEXT
          # deploy's startup probe instead, since Cloud Run only ever sees
          # env values Terraform actually wrote. Found by exactly that
          # failure on this pipeline's first live run: ci.yml's plan-only
          # steps had the same gap, but a plan never pushes new env vars to
          # a running service, so it never surfaced there.
          TF_VAR_workos_authkit_domain: ${{ vars.WORKOS_AUTHKIT_DOMAIN }}
          TF_VAR_mcp_resource_url: ${{ vars.STAGING_MCP_RESOURCE_URL }}
          # MCP token binding. The owner's WorkOS user id is shared with
          # production (one AuthKit environment, one owner); a bool TF_VAR
          # cannot be blank, hence the 'true' fallback for an unset variable.
          TF_VAR_mcp_owner_subject: ${{ vars.MCP_OWNER_SUBJECT }}
          TF_VAR_mcp_enforce_audience: ${{ vars.MCP_ENFORCE_AUDIENCE || 'true' }}
          # Sous Chef assistant — Anthropic Workload Identity Federation ids.
          # Repository *variables*, not secrets: the runtime service account's
          # identity token is the credential; these only name the rule. Unset
          # (empty) leaves the assistant off. Set the three together, and only
          # alongside STAGING_REDIS_CONFIGURED=true — the backend refuses to start
          # with federation and no Redis (config.validate_production_settings).
          TF_VAR_anthropic_federation_rule_id: ${{ vars.STAGING_ANTHROPIC_FEDERATION_RULE_ID }}
          TF_VAR_anthropic_service_account_id: ${{ vars.STAGING_ANTHROPIC_SERVICE_ACCOUNT_ID }}
          TF_VAR_anthropic_workspace_id: ${{ vars.STAGING_ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          # The organization is one value for both environments, but the rule and
          # service account are per-environment: passing the shared org id to an
          # environment with no rule of its own is a partial set, which the root
          # variable validation refuses — configuring production would break the
          # staging apply. Pass it only alongside this environment's own rule.
          if [ -n "${{ vars.STAGING_ANTHROPIC_FEDERATION_RULE_ID }}" ]; then
            export TF_VAR_anthropic_organization_id="${{ vars.ANTHROPIC_ORGANIZATION_ID }}"
          fi
          if [ "${{ vars.STAGING_REDIS_CONFIGURED }}" = "true" ]; then
            export TF_VAR_redis_url="${{ secrets.STAGING_REDIS_URL }}"
          fi
          if [ "${{ vars.STAGING_RESEND_CONFIGURED }}" = "true" ]; then
            export TF_VAR_resend_api_key="${{ secrets.STAGING_RESEND_API_KEY }}"
          fi
          terraform init -input=false
          terraform plan -lock-timeout=5m -input=false -no-color -out=tfplan
          terraform apply -lock-timeout=5m -input=false -no-color -auto-approve tfplan

  staging-deploy:
    name: Deploy candidate to staging
    needs: [build, staging-apply]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.describe.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Authenticate as mfs-deploy (staging)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: mfs-deploy@${{ vars.GCP_PROJECT_ID_STAGING }}.iam.gserviceaccount.com

      - name: Deploy candidate revision (no traffic yet)
        run: |
          gcloud run deploy mfs-backend \
            --project=${{ vars.GCP_PROJECT_ID_STAGING }} \
            --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_STAGING }}/mfs/backend@${{ needs.build.outputs.digest }} \
            --no-traffic \
            --tag=candidate-${{ needs.build.outputs.short_sha }} \
            --quiet

      - name: Smoke test the candidate revision
        run: |
          set -euo pipefail
          candidate_url=$(gcloud run services describe mfs-backend \
            --project=${{ vars.GCP_PROJECT_ID_STAGING }} \
            --region=${{ env.REGION }} \
            --format=json \
            | python3 -c "import json,sys; svc=json.load(sys.stdin); print(next(t['url'] for t in svc['status']['traffic'] if t.get('tag') == 'candidate-${{ needs.build.outputs.short_sha }}'))")
          echo "Candidate URL: $candidate_url"
          python3 backend/scripts/smoke_test_deploy.py --url "$candidate_url"

      - name: Promote candidate to serve all staging traffic
        run: |
          gcloud run services update-traffic mfs-backend \
            --project=${{ vars.GCP_PROJECT_ID_STAGING }} \
            --region=${{ env.REGION }} \
            --to-tags=candidate-${{ needs.build.outputs.short_sha }}=100 \
            --quiet

      - name: Read the service URL
        id: describe
        run: |
          url=$(gcloud run services describe mfs-backend \
            --project=${{ vars.GCP_PROJECT_ID_STAGING }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"

  staging-seed:
    name: Seed staging sample data
    needs: staging-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.lock

      # mfs-terraform, not mfs-deploy — seeding is a Firestore write, which
      # mfs-deploy deliberately has no access to (it only ever pushes images
      # and updates Cloud Run traffic). mfs-terraform's roles/editor already
      # covers Firestore, so this reuses an existing grant rather than
      # adding a third identity or widening mfs-deploy's narrow scope.
      - name: Authenticate as mfs-terraform
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # No --force: a no-op once staging already has sample data, so repeated
      # merges never re-wipe it. See seed.py's own docstring.
      - name: Seed staging Firestore
        working-directory: backend
        run: python seed.py --project=${{ vars.GCP_PROJECT_ID_STAGING }}

  staging-e2e:
    name: E2E against staging
    needs: [staging-deploy, staging-seed]
    runs-on: ubuntu-latest
    # write, not read: this job fast-forwards the `staging` branch below so
    # Cloudflare Pages' branch-tracked alias rebuilds against this commit.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Cloudflare Pages' "staging" branch alias (staging.madeforseconds.pages.dev,
      # docs/DEPLOYMENT.md § Cloudflare Pages) tracks a `staging` git branch,
      # not `main` — fast-forwarding it here is what makes the frontend this
      # step tests against reflect the commit actually being promoted.
      - name: Fast-forward the staging branch to this commit
        run: |
          git push origin ${{ github.sha }}:refs/heads/staging --force

      # Cloudflare's own build+deploy for the branch push above is not
      # something this workflow has a token to poll (no Cloudflare API call
      # here yet — CLOUDFLARE_API_TOKEN exists for the Pages *project*
      # itself, set up in PR 9, but polling its Deployments API for build
      # completion is a follow-up, not this PR's job). A fixed wait is a
      # known rough edge, not a design intended to stay this way — Vite's
      # build is small and Cloudflare Pages builds typically finish well
      # under this, but a real run is what will actually prove the margin.
      - name: Wait for Cloudflare Pages to rebuild the staging alias
        run: sleep 90

      # --project=chromium: matches the "Install Playwright chromium" step
      # above — firefox/webkit binaries were never installed, so a bare
      # `playwright test` fails every test on those two projects with
      # "Executable doesn't exist", found on this pipeline's first real run.
      #
      # --grep-invert excludes admin-recipes.spec.ts's whole "Admin Recipes"
      # suite and navigation.spec.ts's "admin link visibility" test.
      # Staging deliberately runs with real auth and no dev bypass
      # (terraform/environments/staging/main.tf's own comment: "staging
      # exists to exercise real auth... not the dev bypass") — both specs
      # rely on `sessionStorage.setItem('mfs_dev_admin', 'true')`, which
      # only works against the local/CI emulator stack. Real staging admin
      # coverage (auth denial, not the dev bypass) is PR 25/26's job, not
      # this one's — this is the plan's own already-accepted "No real
      # Identity Platform login" deviation, not a new gap.
      - name: Run full Playwright E2E suite against staging
        run: npx playwright test --project=chromium --grep-invert "Admin Recipes|admin link visibility"
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://staging.madeforseconds.pages.dev

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report-staging
          path: playwright-report/
          retention-days: 7

  production-apply:
    name: Apply Terraform (production)
    needs: staging-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: 1.15.9

      - name: Authenticate as mfs-terraform
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # See the identical guard on staging-apply for why this exists: these
      # three vars default to "" and gate their Secret Manager resource's
      # very existence — a blank value here would DESTROY production's real
      # Stripe/JWT secrets on a real apply, not just fail to update them.
      - name: Verify required secrets are present before applying
        run: |
          missing=""
          [ -z "${{ secrets.PROD_STRIPE_SECRET_KEY }}" ] && missing="$missing PROD_STRIPE_SECRET_KEY"
          [ -z "${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}" ] && missing="$missing PROD_STRIPE_WEBHOOK_SECRET"
          [ -z "${{ secrets.PROD_SUBSCRIBER_JWT_SECRET }}" ] && missing="$missing PROD_SUBSCRIBER_JWT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing — refusing to apply, this would destroy the real production Secret Manager resource(s) rather than just fail to update them."
            exit 1
          fi

      - name: Terraform init/plan/apply — production
        working-directory: terraform
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID_PROD }}
          TF_VAR_admin_emails: ${{ vars.ADMIN_EMAILS }}
          TF_VAR_allowed_origins: ${{ vars.PROD_ALLOWED_ORIGINS }}
          TF_VAR_backend_image: ${{ vars.PROD_BACKEND_IMAGE }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
          TF_VAR_state_admin_email: ${{ vars.STATE_ADMIN_EMAIL }}
          TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          TF_VAR_deployment_target: production
          TF_VAR_staging_gcp_project_id: ${{ vars.GCP_PROJECT_ID_STAGING }}
          TF_VAR_stripe_secret_key: ${{ secrets.PROD_STRIPE_SECRET_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}
          TF_VAR_subscriber_jwt_secret: ${{ secrets.PROD_SUBSCRIBER_JWT_SECRET }}
          # See the identical comment on staging-apply for why these two are
          # here at all.
          TF_VAR_workos_authkit_domain: ${{ vars.WORKOS_AUTHKIT_DOMAIN }}
          TF_VAR_mcp_resource_url: ${{ vars.PROD_MCP_RESOURCE_URL }}
          # See the identical comment on staging-apply.
          TF_VAR_mcp_owner_subject: ${{ vars.MCP_OWNER_SUBJECT }}
          TF_VAR_mcp_enforce_audience: ${{ vars.MCP_ENFORCE_AUDIENCE || 'true' }}
          # Sous Chef assistant — Anthropic Workload Identity Federation ids.
          # Repository *variables*, not secrets: the runtime service account's
          # identity token is the credential; these only name the rule. Unset
          # (empty) leaves the assistant off. Set the three together, and only
          # alongside PROD_REDIS_CONFIGURED=true — the backend refuses to start
          # with federation and no Redis (config.validate_production_settings).
          TF_VAR_anthropic_federation_rule_id: ${{ vars.PROD_ANTHROPIC_FEDERATION_RULE_ID }}
          TF_VAR_anthropic_service_account_id: ${{ vars.PROD_ANTHROPIC_SERVICE_ACCOUNT_ID }}
          TF_VAR_anthropic_workspace_id: ${{ vars.PROD_ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          # The organization is one value for both environments, but the rule and
          # service account are per-environment: passing the shared org id to an
          # environment with no rule of its own is a partial set, which the root
          # variable validation refuses — configuring production would break the
          # staging apply. Pass it only alongside this environment's own rule.
          if [ -n "${{ vars.PROD_ANTHROPIC_FEDERATION_RULE_ID }}" ]; then
            export TF_VAR_anthropic_organization_id="${{ vars.ANTHROPIC_ORGANIZATION_ID }}"
          fi
          if [ "${{ vars.PROD_REDIS_CONFIGURED }}" = "true" ]; then
            export TF_VAR_redis_url="${{ secrets.PROD_REDIS_URL }}"
          fi
          if [ "${{ vars.PROD_RESEND_CONFIGURED }}" = "true" ]; then
            export TF_VAR_resend_api_key="${{ secrets.PROD_RESEND_API_KEY }}"
          fi
          if [ "${{ vars.PROD_INSTAGRAM_CONFIGURED }}" = "true" ]; then
            export TF_VAR_instagram_user_id="${{ vars.PROD_INSTAGRAM_USER_ID }}"
            export TF_VAR_instagram_access_token="${{ secrets.PROD_INSTAGRAM_ACCESS_TOKEN }}"
          fi
          terraform init -input=false
          terraform plan -lock-timeout=5m -input=false -no-color -out=tfplan
          terraform apply -lock-timeout=5m -input=false -no-color -auto-approve tfplan

  production-deploy:
    name: Promote candidate to production
    needs: [build, production-apply]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Authenticate as mfs-deploy (production)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: mfs-deploy@${{ vars.GCP_PROJECT_ID_PROD }}.iam.gserviceaccount.com

      - name: Deploy candidate revision (no traffic yet)
        run: |
          gcloud run deploy mfs-backend \
            --project=${{ vars.GCP_PROJECT_ID_PROD }} \
            --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_PROD }}/mfs/backend@${{ needs.build.outputs.digest }} \
            --no-traffic \
            --tag=candidate-${{ needs.build.outputs.short_sha }} \
            --quiet

      - name: Smoke test the candidate revision
        run: |
          set -euo pipefail
          candidate_url=$(gcloud run services describe mfs-backend \
            --project=${{ vars.GCP_PROJECT_ID_PROD }} \
            --region=${{ env.REGION }} \
            --format=json \
            | python3 -c "import json,sys; svc=json.load(sys.stdin); print(next(t['url'] for t in svc['status']['traffic'] if t.get('tag') == 'candidate-${{ needs.build.outputs.short_sha }}'))")
          echo "Candidate URL: $candidate_url"
          python3 backend/scripts/smoke_test_deploy.py --url "$candidate_url"

      - name: Promote candidate to serve all production traffic
        run: |
          gcloud run services update-traffic mfs-backend \
            --project=${{ vars.GCP_PROJECT_ID_PROD }} \
            --region=${{ env.REGION }} \
            --to-tags=candidate-${{ needs.build.outputs.short_sha }}=100 \
            --quiet
