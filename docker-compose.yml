services:
  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mfs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Firestore Emulator ──────────────────────────────────────────────────────
  firestore-emulator:
    image: google/cloud-sdk:emulators
    container_name: mfs-firestore
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8080
      --project=madefor-seconds-local
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mfs-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      GCP_PROJECT_ID: madefor-seconds-local
      ADMIN_EMAILS: dev@local
      ENVIRONMENT: development
      ALLOWED_ORIGINS: http://localhost:5173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MCP_API_KEY: dev-mcp-key
      REDIS_URL: redis://redis:6379
    depends_on:
      firestore-emulator:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # ─── Vite Frontend ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mfs-app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend
    env_file:
      - .env.local

volumes:
  node_modules:
